<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StepCap</title>
<!-- rendered guide (view mode + export); export embeds exactly this block -->
<style id="rg-css">
  .rg-wrap{max-width:960px;margin:0 auto;font:15px/1.6 "Segoe UI","Leelawadee UI",system-ui,sans-serif;color:#111827;
    overflow-wrap:anywhere}
  .rg-wrap *{box-sizing:border-box}
  .rg-wrap h1{font-size:28px;line-height:1.35;margin:0 0 6px}
  .rg-meta{color:#6b7280;font-size:13px;margin-bottom:18px}
  .rg-desc{margin:0 0 18px;white-space:pre-wrap;color:#374151}
  .rg-secwrap{margin:34px 0 10px;scroll-margin-top:72px}
  .rg-sec{font-size:22px;margin:0 0 6px;padding-bottom:6px;border-bottom:1px solid #e5e7eb}
  .rg-body{margin:0;white-space:pre-wrap;color:#374151}
  .rg-missing{padding:14px 16px;border:1px dashed #d1d5db;border-radius:8px;color:#6b7280}
  .rg-toc{border:1px solid #e5e7eb;border-radius:8px;padding:14px 18px;margin:0 0 26px;background:#fafafa}
  .rg-toc b{display:block;margin-bottom:6px}
  .rg-toc ol{margin:0;padding-left:22px}
  .rg-toc li{padding:3px 0}
  .rg-toc a{color:#111827;text-decoration:underline dotted #9ca3af;text-underline-offset:3px}
  .rg-toc a:hover{text-decoration:underline solid}
  .rg-step{margin:0 0 30px;scroll-margin-top:72px}
  .rg-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;font-size:16px;font-weight:600}
  .rg-head>div{min-width:0}
  .rg-num{width:26px;height:26px;border-radius:50%;background:#fb923c;color:#3a1d02;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:13px;margin-top:1px}
  .rg-note{background:rgba(251,146,60,.12);border-left:3px solid #fb923c;padding:10px 14px;border-radius:6px}
  .rg-step canvas{display:block;width:100%;height:auto;border:1px solid #e5e7eb;border-radius:8px}
  .rg-step img.rg-gif{display:block;max-width:100%;height:auto;border:1px solid #e5e7eb;border-radius:8px}
  .rg-empty{color:#6b7280;padding:24px 0}
</style>
<style>
  :root{
    /* tokens: DESIGN.md. --line is for dividers; controls use --line-strong (3:1) */
    --bg:#ffffff; --side:#f7f8fa; --ink:#111827; --ink-2:#374151; --muted:#6b7280;
    --line:#e5e7eb; --line-strong:#868c98; --hover:#f3f4f6; --accent:#fb923c; --dark:#111827;
    --danger:#dc2626; --danger-ink:#b91c1c; --danger-bg:#fef2f2; --focus:#2563eb;
  }
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font:14px/1.5 "Segoe UI","Leelawadee UI",system-ui,sans-serif}
  button{font:inherit;color:inherit;cursor:pointer}
  button:disabled{cursor:default}
  svg{flex:0 0 auto}
  .muted{color:var(--muted)}
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:#fff;
    border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;white-space:nowrap}
  .btn:hover:not(:disabled){background:var(--hover)}
  .btn:active:not(:disabled){filter:brightness(.93)}
  .btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}
  .btn.dark:hover{background:#1f2937}
  .btn.red{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn.red:hover{background:#b91c1c}
  .btn.danger{color:var(--danger-ink)}
  .btn:disabled{opacity:.45;cursor:default}
  .full{width:100%;justify-content:center}

  /* shell */
  .shell{display:flex;height:100vh}
  .side{width:236px;flex:0 0 236px;background:var(--side);border-right:1px solid var(--line);
    padding:14px 12px;display:flex;flex-direction:column;gap:12px}
  .logo{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;padding:2px 6px}
  .search{display:flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:8px;
    background:#fff;padding:6px 10px;color:var(--muted)}
  .search:focus-within{outline:2px solid var(--focus);outline-offset:1px}
  .search input{border:0;outline:0;font:inherit;color:var(--ink);background:transparent;width:100%}
  .menu{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:12px}
  .menu button{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;color:var(--ink);
    border:0;background:transparent;width:100%;text-align:left}
  .menu button:hover{background:var(--hover)}
  .menu button.on{background:#eceef1;font-weight:700}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{height:56px;flex:0 0 56px;border-bottom:1px solid var(--line);display:flex;align-items:center;
    justify-content:space-between;padding:0 24px;gap:12px}
  .crumb{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
  .scroll{flex:1;overflow:auto}
  .content{max-width:1100px;margin:0 auto;padding:24px 32px 48px}

  /* record menu + popovers */
  .rec-wrap{position:relative}
  .pop{position:absolute;right:0;top:calc(100% + 6px);width:310px;background:#fff;border:1px solid var(--line);
    border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:12px;z-index:30}
  .pop-h{font-weight:700;margin-bottom:8px}
  .mons{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
  .mon{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line-strong);
    background:#fff;border-radius:8px;padding:9px 10px}
  .mon:hover{background:var(--hover)}
  .mon.on{border-color:var(--ink)}
  .mon:disabled{opacity:.5;cursor:default}
  .mon .ck{margin-left:auto;visibility:hidden}
  .mon.on .ck{visibility:visible}
  .menu-pop{position:fixed;min-width:170px;background:#fff;border:1px solid var(--line);border-radius:8px;
    box-shadow:0 8px 24px rgba(0,0,0,.12);padding:4px;z-index:40}
  .menu-pop button{display:block;width:100%;text-align:left;border:0;background:transparent;
    padding:7px 10px;border-radius:6px}
  .menu-pop button:hover{background:var(--hover)}
  .menu-pop button.danger{color:var(--danger)}

  /* banners */
  .banner{border-radius:8px;padding:12px 16px;margin-bottom:18px}
  .banner.warn{background:var(--danger-bg);color:var(--danger-ink);font-weight:600;border:1px solid #fecaca}
  .banner.rec{background:var(--dark);color:#fff}
  .rec-h{display:flex;align-items:center;gap:12px}
  .rec-h .sp{flex:1}
  .rec-h .live{color:#f87171}
  .rec-h .paused{color:#facc15}
  .banner ol{margin:8px 0 0;padding-left:24px}
  .banner .pending{color:#cbd5e1;font-style:italic;margin-top:4px}
  .banner .btn{background:transparent;color:#fff;border-color:#4b5563}
  .banner .btn:hover{background:#1f2937}
  .banner .btn.red{background:var(--danger);border-color:var(--danger)}

  /* sections */
  .sec-h{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
  .sec-h h2{font-size:20px;margin:0;flex:1}
  section+section{margin-top:36px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{border:0;background:#fff;padding:5px 8px;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:var(--hover);color:var(--ink)}
  .center{text-align:center;margin-top:18px}
  .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .stat{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:8px;padding:18px 22px}
  .stat span{flex:1}
  .stat b{font-size:20px}
  .intro{color:var(--ink-2);margin:0 0 22px}
  .intro p{margin:0 0 6px;font-size:15px;color:var(--ink)}
  .intro ol{margin:0;padding-left:22px}
  .empty{color:var(--muted);padding:28px 0;text-align:center}
  .chk{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer}

  /* guide cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .card{position:relative;border:1px solid var(--line);border-radius:8px;padding:20px;background:#fff;
    cursor:pointer;min-height:170px;display:flex;flex-direction:column;gap:10px}
  .card:hover{box-shadow:0 1px 6px rgba(0,0,0,.08)}
  .app{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;min-width:0;padding-right:56px}
  .app span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .appicon{width:32px;height:32px;border-radius:50%;background:var(--hover);display:inline-flex;
    align-items:center;justify-content:center;color:#6366f1;flex:0 0 32px;overflow:hidden}
  .appicon img{width:20px;height:20px}
  .card.broken,.row.broken{border-style:dashed}
  .card .title{font-size:16px;font-weight:600;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden}
  .meta{color:var(--muted);font-size:13px;margin-top:auto}
  .meta .dot{margin:0 6px}
  .ctools{position:absolute;top:10px;right:10px;display:flex;background:#fff;border:1px solid var(--line);
    border-radius:6px;opacity:0;transition:opacity .12s}
  .card:hover .ctools,.row:hover .ctools,.ctools.open,.ctools:focus-within{opacity:1}
  @media (hover:none){.ctools{opacity:1}}
  .card.marked .ctools,.row.marked .ctools{opacity:1}
  .card.marked:not(:hover) .ctools:not(.open) .more,.row.marked:not(:hover) .ctools:not(.open) .more{display:none}
  .tool{border:0;background:transparent;padding:5px 6px;display:inline-flex;color:var(--ink);border-radius:5px}
  .tool:hover{background:var(--hover)}
  .rows{border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .row{position:relative;display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line);
    cursor:pointer;background:#fff;min-height:58px}
  .row:first-child{border-top:0}
  .row:hover{background:#fafafa}
  .row.static{cursor:default}
  .row .ctools{position:static}
  .r-title{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .r-app,.r-ago,.r-count{color:var(--muted);font-size:13px;white-space:nowrap}
  .r-btns{display:flex;gap:8px}

  /* settings */
  .set{border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-top:16px}
  .set h3{margin:0 0 4px;font-size:15px}
  .set .mons{max-width:420px;margin:10px 0 0}
  .kv{display:flex;align-items:center;gap:6px;margin:8px 0}
  .kv span{margin-left:10px}
  kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 7px;font:12px "Segoe UI";background:#fafafa}
  .path{font-family:Consolas,monospace;font-size:13px;background:var(--hover);border-radius:6px;padding:7px 10px;
    margin:8px 0 12px;word-break:break-all}
  .switch{position:relative;display:inline-block;width:36px;height:20px;vertical-align:middle;flex:0 0 36px}
  .switch input{opacity:0;width:0;height:0;position:absolute}
  .switch span{position:absolute;inset:0;background:var(--line-strong);border-radius:20px;transition:.15s;cursor:pointer}
  .switch input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
  .swlabel{display:inline-flex;align-items:center;gap:10px;cursor:pointer}
  .switch span::before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;
    border-radius:50%;transition:.15s}
  .switch input:checked+span{background:var(--dark)}
  .switch input:checked+span::before{transform:translateX(16px)}
  .switch input:disabled+span{opacity:.5;cursor:default}
  .soon{display:flex;align-items:center;gap:10px;margin-top:8px}
  #redcover{position:fixed;inset:0;z-index:1000;background:rgba(255,255,255,.92);display:flex;
    align-items:center;justify-content:center;font-size:18px;font-weight:600}
  .pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:12px}
  .pcard{position:relative;border:1px solid var(--line);border-radius:8px;padding:16px 44px 16px 16px;cursor:pointer;background:#fff}
  .pcard:hover{box-shadow:0 1px 6px rgba(0,0,0,.08)}
  .pcard .pc-title{font-weight:600;margin-bottom:4px}
  .pcard .more{position:absolute;top:8px;right:6px}
  .pedit{max-width:820px;margin:0 auto}
  .pedit #pdesc{resize:vertical}
  .pset{display:flex;flex-wrap:wrap;gap:8px 18px;margin:12px 0}
  .psec{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
  .psec .pmain{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
  .psec.text .pmain{flex-direction:column;align-items:stretch}
  .psec .pbtns{display:flex;gap:2px}
  .psec a{color:var(--ink);text-decoration:none;font-weight:600}
  .psec a:hover{text-decoration:underline}
  .pmeta{color:var(--muted);font-size:13px}
  .padd{display:flex;gap:8px;margin-top:12px}
  .plist{max-height:320px;overflow:auto;margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .redrules{display:flex;flex-wrap:wrap;gap:8px 18px;margin:12px 0}
  .langs{display:flex;gap:8px 24px;margin-top:4px}.langs .chk{color:var(--ink);font-size:14px}
  #redwords{max-width:420px;margin-top:4px;resize:vertical}

  /* dialogs + toast */
  dialog.ui-dlg{border:0;border-radius:12px;padding:20px;width:420px;max-width:90vw;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  dialog.ui-dlg::backdrop{background:rgba(17,24,39,.35)}
  .dlg-t{margin:0 0 12px;font-weight:600;white-space:pre-line}
  .dlg-in{width:100%;font:inherit;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px}
  .dlg-hint{color:var(--danger-ink);font-size:13px;margin-top:6px}
  .dlg-b{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  #toasts{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:2003;display:flex;
    flex-direction:column;align-items:center;gap:8px;pointer-events:none;max-width:min(640px,90vw)}
  .toast{background:var(--dark);color:#fff;padding:9px 16px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);
    pointer-events:auto}
  .toast.err{background:var(--danger-ink)}

  /* first-time tour (ui/tour.js) */
  .tour-shade{position:fixed;inset:0;z-index:2000}
  .tour-ring{position:fixed;z-index:2001;border-radius:8px;outline:2px solid var(--focus);pointer-events:none;
    box-shadow:0 0 0 9999px rgba(17,24,39,.45);transition:left .15s,top .15s,width .15s,height .15s}
  .tour-box{position:fixed;z-index:2002;width:320px;max-width:calc(100vw - 24px);background:#fff;border-radius:12px;
    padding:16px 18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .tour-title{font-weight:700;font-size:15px;margin:0 0 6px}
  .tour-text{margin:0 0 14px;color:var(--ink-2)}
  .tour-foot{display:flex;align-items:center;gap:8px}
  .tour-count{color:var(--muted);font-size:13px;margin-right:auto}
  .toast.err::before{content:"\26A0  ";font-weight:700}

  /* guide page (view + edit) */
  .gtop{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);height:56px;
    display:flex;align-items:center;gap:10px;padding:0 20px}
  .gtop .gtitle{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gtop input.gtitle{font:inherit;font-size:16px;font-weight:600;border:1px solid var(--line);border-radius:6px;padding:6px 8px}
  .gtop input.gtitle:hover{border-color:var(--line-strong)}
  .gtop input.gtitle:focus{border-color:var(--focus);outline:1px solid var(--focus)}
  .icon-btn{border:0;background:transparent;padding:6px;border-radius:6px;display:inline-flex;
    min-width:32px;min-height:32px;align-items:center;justify-content:center}
  .icon-btn:hover:not(:disabled){background:var(--hover)}
  .icon-btn:disabled{opacity:.3}
  .gbody{padding:28px 32px 64px}
  .ewrap{max-width:860px;margin:0 auto}
  .step{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;scroll-margin-top:72px}
  .step.dragging{opacity:.4}
  .step .row1{display:flex;gap:8px;align-items:flex-start}
  .num{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#3a1d02;font-weight:700;display:flex;
    align-items:center;justify-content:center;flex:0 0 auto;font-size:13px;cursor:grab}
  .notetag{font-size:12px;font-weight:700;color:#9a4d06;background:rgba(251,146,60,.15);border-radius:6px;
    padding:3px 8px;cursor:grab;flex:0 0 auto}
  .step .txt{flex:1;min-width:0}
  .kindtag{font-size:12px;color:var(--muted);letter-spacing:.02em}
  .stext{font:inherit;color:var(--ink);width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px}
  .step .sbtns{display:flex;gap:2px;flex:0 0 auto}
  .step .etools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .eprev canvas,.eprev img{display:block;width:100%;height:auto;margin-top:10px;border:1px solid var(--line);border-radius:8px}
  .eprev img{width:auto;max-width:100%}
  .imgfail{margin-top:10px;border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--muted)}
  .addbar{display:flex;gap:8px;margin-top:4px}
  .gthumb img{max-width:100%;max-height:100%;object-fit:contain;display:block}

  /* full-window image editor */
  .ied{position:fixed;inset:0;z-index:50;background:#eef0f3;display:flex;flex-direction:column}
  .ied-bar{display:flex;align-items:center;gap:4px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line);padding:8px 14px}
  .ied-bar .sp{flex:1}
  .ied-bar .btn{margin-left:6px}
  .ied .tb.on{background:var(--hover);box-shadow:inset 0 0 0 1px var(--line)}
  .ied .tb[data-tip]:hover::after,.ied .tb[data-tip]:focus-visible::after{right:auto;left:50%;top:calc(100% + 8px);transform:translateX(-50%);z-index:5}
  .ied-opts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:48px;padding:6px 16px;
    background:#fff;border-bottom:1px solid var(--line);font-size:13px}
  .ied-opts .sw{margin:0}
  .ied-opts .icol{width:34px;height:28px;border:1px solid var(--line);border-radius:6px;padding:2px;background:#fff}
  .ied-opts .seg button{padding:4px 10px}
  .ied-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .ied-stage canvas{display:block;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.18);touch-action:none}
  .ied-stage canvas.crosshair{cursor:crosshair}
  .gbody.edit{padding-right:84px}

  /* edit mode: floating toolbar */
  .etb{position:fixed;right:16px;top:88px;display:flex;flex-direction:column;gap:4px;background:#fff;
    border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.06);z-index:25}
  .tb{width:36px;height:36px;border:0;background:transparent;border-radius:8px;display:inline-flex;
    align-items:center;justify-content:center;position:relative}
  .tb:hover{background:var(--hover)}
  .tb.off{opacity:.4;cursor:default}
  .tb.busy{opacity:.5;cursor:progress}
  .tb.off:hover{background:transparent}
  .tb[data-tip]:hover::after,.tb[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;right:calc(100% + 10px);top:50%;
    transform:translateY(-50%);background:var(--dark);color:#fff;font-size:13px;white-space:nowrap;
    padding:4px 10px;border-radius:6px;pointer-events:none}
  .tbpop{position:absolute;right:calc(100% + 10px);width:280px;background:#fff;border:1px solid var(--line);
    border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:12px}
  .sw{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
  .swatch{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
  .swatch.on{box-shadow:0 0 0 2px var(--ink)}
  .custom{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .custom input[type=color]{width:38px;height:34px;border:1px solid var(--line);border-radius:6px;padding:2px;background:#fff;flex:0 0 38px}
  .srow{display:flex;align-items:center;justify-content:space-between;padding:6px 0;cursor:pointer}
  .seg.wide{display:flex}
  .seg.wide button{flex:1;justify-content:center;padding:6px 8px}
  .small{font-size:12px}

  /* edit mode: grid layout */
  .egrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
  .gcard{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;cursor:pointer}
  .gcard:hover{box-shadow:0 1px 6px rgba(0,0,0,.08)}
  .gcard.dragging{opacity:.4}
  .gthumb{aspect-ratio:16/10;background:#f3f4f6;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .gthumb canvas{width:100%;height:100%;object-fit:contain;display:block}
  .gtext{padding:14px;color:#4b5563;font-size:13px;display:-webkit-box;-webkit-line-clamp:4;
    -webkit-box-orient:vertical;overflow:hidden}
  .gcap{display:flex;gap:8px;align-items:flex-start;padding:10px 12px}
  .gcap .num{width:22px;height:22px;font-size:12px;cursor:inherit}
  .gt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px}

  /* narrow window or zoomed in: the sidebar becomes a strip on top */
  @media (max-width:760px){
    .shell{flex-direction:column}
    .side{width:auto;flex:0 0 auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;
      border-right:0;border-bottom:1px solid var(--line);padding:8px 12px}
    .search{flex:1 1 140px}
    .menu{flex-direction:row;flex-wrap:wrap;border-top:0;padding-top:0;width:100%}
    .menu button{width:auto}
    .main{min-height:0}
    .top{padding:0 12px}
    .content{padding:16px 16px 40px}
    .row,.r-btns{flex-wrap:wrap}
    .gtop{padding:0 10px;gap:6px}
    .gbody{padding:20px 16px 48px}
    .gbody.edit{padding-right:64px}
    .egrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  /* Guide Me side panel (its own narrow window) */
  .gm{display:flex;flex-direction:column;height:100vh;background:var(--side)}
  .gm-top{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 16px;background:#fff;border-bottom:1px solid var(--line)}
  .gm-title{flex:1;min-width:0;font-size:15px;font-weight:600;overflow-wrap:anywhere}
  .gm-list{flex:1;overflow-y:auto;margin:0;padding:12px;list-style:none;display:flex;flex-direction:column;gap:8px}
  .gm-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
  .gm-card:hover{background:var(--hover)}
  .gm-card.on{cursor:default;background:#fff;box-shadow:0 2px 8px rgba(17,24,39,.08);padding:14px}
  .gm-head{display:flex;gap:10px;align-items:flex-start}
  .gm-num{flex:0 0 auto;min-width:26px;height:26px;border-radius:13px;background:var(--hover);color:var(--ink-2);
    display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .gm-card.on .gm-num{background:var(--accent);color:#3a1d02}
  .gm-text{min-width:0;overflow-wrap:anywhere;color:var(--ink-2)}
  .gm-card:not(.on) .gm-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gm-card.on .gm-text{color:var(--ink);font-weight:600}
  .gm-status{margin:10px 0 0;font-size:13px;color:var(--muted)}
  .gm-status.warn{color:var(--danger-ink);background:var(--danger-bg);border-radius:8px;padding:8px 10px}
  /* the zoom button sits under the picture: on it, it would hide targets in a corner */
  .gm-pic{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin:10px -8px 0}
  .gm-img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px;cursor:zoom-in}
  .gm-zoom{border:1px solid var(--line-strong);background:#fff}
  .gm-pic:has(.gm-zoom[aria-pressed="true"]) .gm-img{cursor:zoom-out}
  .gm-done .btn{margin-top:12px}
  .gm-foot{display:flex;justify-content:space-between;gap:8px;padding:12px;background:#fff;border-top:1px solid var(--line);flex-wrap:wrap}
  .gm-empty{padding:16px}
</style>
</head>
